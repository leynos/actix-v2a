name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    # Ubicloud, to avoid the hosted queue. A pull request from a fork cannot
    # obtain an Ubicloud runner, so it falls back to the hosted pool. Main's
    # Ubicloud coverage-upload writes the cache scope this reads. standard-4,
    # not standard-2: on two vCPUs the uncached tool installs and lint alone
    # took 30 minutes and the job reached its ceiling (run 36565211532).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-4' }}
    # An Ubicloud runner is a self-hosted just-in-time runner with no
    # six-hour hosted cap, so the job states its own ceiling: twice the warm
    # standard-4 run of 9.6 min (run 36568765141), rounded up to 20.
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      WHITAKER_INSTALLER_VERSION: '0.2.6'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@ce8d747242ab3c9d58674d5838cf04c801eeb2f9
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        # v10.0.0
        with:
          python-version: '3.14'
      - name: Spelling
        run: make spelling
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        # v2
        with:
          bun-version: '1.2.21'
      - name: Install Nixie
        run: uv tool install nixie-cli==1.1.0
      - name: Install Merman CLI
        run: cargo install merman-cli --version '=0.7.0' --locked
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Netsuke
        run: >-
          cargo install --git https://github.com/leynos/netsuke.git
          --rev bb1b6b66820f0088286272a25aa990a281602ab2
          netsuke --locked
      - name: Show Netsuke version
        run: netsuke --version
      - name: Validate Netsuke manifest
        run: netsuke manifest -
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@14c325b60788814cd50298eb8060228daee3b842
        with:
          version: "0.6.0"
      - name: Check the CV-005 contracts
        run: make test-workflow-contracts
      - name: Format
        # `make check-fmt` delegates the Rust check to Netsuke and adds the
        # estate `mdtablefix --check` gate.
        run: >-
          set -o pipefail;
          make check-fmt 2>&1 | tee /tmp/netsuke-check-fmt-actix-v2a-adopt-netsuke-ci.out
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
      - name: Validate Mermaid diagrams
        run: >-
          set -o pipefail;
          netsuke --verbose build nixie 2>&1 | tee /tmp/netsuke-nixie-actix-v2a-adopt-netsuke-ci.out
      - name: Cache Whitaker installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/bin/whitaker-installer
            ~/.cache/cargo-binstall
          key: whitaker-installer-${{ runner.os }}-${{ runner.arch }}-${{ env.WHITAKER_INSTALLER_VERSION }}
      - name: Install Whitaker Dylint suite
        run: |
          if ! command -v whitaker-installer >/dev/null 2>&1; then
            if cargo binstall --version >/dev/null 2>&1; then
              cargo binstall --no-confirm --locked "whitaker-installer@${WHITAKER_INSTALLER_VERSION}"
            else
              echo "cargo-binstall unavailable; building whitaker-installer from crates.io"
              cargo install --locked whitaker-installer --version "${WHITAKER_INSTALLER_VERSION}"
            fi
          fi
          whitaker-installer
      - name: Lint
        run: >-
          set -o pipefail;
          netsuke --verbose build lint 2>&1 | tee /tmp/netsuke-lint-actix-v2a-adopt-netsuke-ci.out
      - name: Test and Measure Coverage
        # Coverage here is for the local ratchet and nothing else. The report
        # is neither archived (`publish-artefact: 'false'`) nor sent to
        # CodeScene: a pull request from a fork cannot read
        # `secrets.CS_ACCESS_TOKEN`, so an upload here is silently inert for
        # exactly the changes that most need reviewing, and CodeScene accepts
        # an upload only for a branch it analyses, which a pull request head
        # is not. `coverage-main.yml` owns both persistent outputs, and the
        # baseline paths are the action's defaults on both sides, so this
        # ratchet reads the baseline that workflow writes.
        uses: leynos/shared-actions/.github/actions/generate-coverage@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
          publish-artefact: 'false'
