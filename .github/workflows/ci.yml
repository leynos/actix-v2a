name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    # Ubicloud, to avoid the hosted queue. A pull request from a fork cannot
    # obtain an Ubicloud runner, so it falls back to the hosted pool. Main's
    # Ubicloud coverage-upload writes the cache scope this reads. standard-4,
    # not standard-2: on two vCPUs the uncached tool installs and lint alone
    # took 30 minutes and the job reached its ceiling (run 36565211532).
    # Dependabot pull requests run on the hosted pool too (free on a public
    # repository). The author is tested, not the actor, which changes when
    # someone else pushes to the branch.
    runs-on: >-
      ${{ (github.event.pull_request.head.repo.fork
      || github.event.pull_request.user.login == 'dependabot[bot]')
      && 'ubuntu-latest' || 'ubicloud-standard-4' }}
    # An Ubicloud runner is a self-hosted just-in-time runner with no
    # six-hour hosted cap, so the job states its own ceiling: twice the warm
    # standard-4 run of 9.6 min (run 36568765141), rounded up to 20.
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@8e6a325765ba382691d1b1c65fcccf1fc1d1b00c
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        # v10.0.0
        with:
          python-version: '3.14'
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        # v2
        with:
          bun-version: '1.2.21'
      - name: Install Nixie
        run: uv tool install nixie-cli==1.1.0
      - name: Install Merman CLI
        run: cargo install merman-cli --version '=0.7.0' --locked
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Cache Netsuke
        # The key names the release and the nightly it builds with; keep it
        # in step with the install step's environment.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/netsuke
          key: netsuke-${{ runner.os }}-${{ runner.arch }}-0.1.0-beta4-nightly-2026-08-23
      - name: Install Netsuke from crates.io
        # The release builds with the dated nightly its own toolchain file
        # pins, not with this repository's toolchain.
        env:
          NETSUKE_TOOLCHAIN: nightly-2026-08-23
          NETSUKE_VERSION: 0.1.0-beta4
        run: |
          set -euo pipefail
          if netsuke --version 2>/dev/null | grep --fixed-strings --quiet "${NETSUKE_VERSION}"; then
            exit 0
          fi
          rustup toolchain install "${NETSUKE_TOOLCHAIN}" --profile minimal
          cargo "+${NETSUKE_TOOLCHAIN}" install --locked \
            netsuke-build --version "=${NETSUKE_VERSION}"
      - name: Show Netsuke version
        run: netsuke --version
      - name: Validate Netsuke manifest
        run: netsuke generate > /dev/null
      - name: Spelling
        run: netsuke build spelling
      - name: Install mdtablefix
        # `netsuke build check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@8e6a325765ba382691d1b1c65fcccf1fc1d1b00c
        with:
          version: "0.6.1"
      - name: Check the CV-005 contracts
        run: netsuke build test-workflow-contracts
      - name: Format
        # `netsuke build check-fmt` runs the Rust check and the estate
        # `mdtablefix --check` gate.
        run: >-
          set -o pipefail;
          netsuke --verbose build check-fmt 2>&1 | tee /tmp/netsuke-check-fmt-actix-v2a-adopt-netsuke-ci.out
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
      - name: Validate Mermaid diagrams
        run: >-
          set -o pipefail;
          netsuke --verbose build nixie 2>&1 | tee /tmp/netsuke-nixie-actix-v2a-adopt-netsuke-ci.out
      - name: Install Whitaker Dylint suite
        uses: leynos/shared-actions/.github/actions/install-whitaker@5a99aed78ce68dcebd3052b75c31e6f173162b1e
      - name: Lint
        run: >-
          set -o pipefail;
          netsuke --verbose build lint 2>&1 | tee /tmp/netsuke-lint-actix-v2a-adopt-netsuke-ci.out
      - name: Test and Measure Coverage
        # Coverage here is for the local ratchet and nothing else. The report
        # is neither archived (`publish-artefact: 'false'`) nor sent to
        # CodeScene: a pull request from a fork cannot read
        # `secrets.CS_ACCESS_TOKEN`, so an upload here is silently inert for
        # exactly the changes that most need reviewing, and CodeScene accepts
        # an upload only for a branch it analyses, which a pull request head
        # is not. `coverage-main.yml` owns both persistent outputs, and the
        # baseline paths are the action's defaults on both sides, so this
        # ratchet reads the baseline that workflow writes.
        uses: leynos/shared-actions/.github/actions/generate-coverage@8e6a325765ba382691d1b1c65fcccf1fc1d1b00c
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
          publish-artefact: 'false'
