name: Coverage (main)

# Main owns both persistent coverage outputs: the CodeScene upload and the
# ratchet baseline. Pull requests generate coverage only for their own local
# ratchet check, in `ci.yml`; they neither publish a report nor contact
# CodeScene.
#
# CodeScene accepts `cs-coverage upload` only for a branch it analyses, which a
# pull request head is not, and a pull request from a fork cannot read
# `secrets.CS_ACCESS_TOKEN` at all. Caches and baselines written on `main` are
# readable by every pull-request run, so the baseline written here is the one
# those ratchet checks compare against.

'on':
  push:
    branches: [main]
  # A dispatch reads the baseline without advancing it: the shared action
  # publishes a new baseline only on a push to `refs/heads/main`, so a manual
  # run can measure this lane without moving the figure it is measuring.
  workflow_dispatch:

# A run in progress is never cancelled. A cancelled publisher abandons both its
# upload and its ratchet baseline write. The group is keyed on the ref alone:
# runs for main never overlap, and GitHub keeps at most one pending run per
# group, so a newer trigger replaces an older pending run rather than queueing
# behind it. GitHub does not promise to start runs in trigger order, so this is
# not a guarantee of commit order. A manual re-run of an older run keeps its
# SHA and its run id: it republishes that commit's coverage to CodeScene, but
# its baseline cache key already exists, so it replaces no baseline unless the
# original run saved none. `netsuke build test-workflow-contracts` pins this
# group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    # Ubicloud's cache proxy is scoped by ref, so a pull request's Ubicloud
    # build-test reads a warm main scope only if a main job on Ubicloud
    # writes it. This is that writer. The fork arm never applies on push or
    # dispatch; it is kept so every Ubicloud lane reads the same way.
    # Dependabot pull requests run on the hosted pool too (free on a public
    # repository). The author is tested, not the actor, which changes when
    # someone else pushes to the branch.
    runs-on: >-
      ${{ (github.event.pull_request.head.repo.fork
      || github.event.pull_request.user.login == 'dependabot[bot]')
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    # An Ubicloud runner is a self-hosted just-in-time runner with no
    # six-hour hosted cap, so the job states its own ceiling. The first
    # Ubicloud main run took 2.4 min (run 36556920321). The test suite now
    # executes Netsuke, and a run that misses the Netsuke cache compiles
    # netsuke-build from source: on standard-4 that added 7.7 min to the
    # pull-request lane (run 40045937287, 17.3 min against a 9.6 min warm
    # run), so allow twice that on two vCPUs. 2.4 + 15.4, doubled and
    # rounded up to 40.
    timeout-minutes: 40
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone; the codescene environment contract holds it to
    # this job.
    environment: codescene
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@8e6a325765ba382691d1b1c65fcccf1fc1d1b00c
      - name: Install Ninja
        # The test suite's `Netsukefile` action tests execute Netsuke, which
        # runs Ninja.
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Cache Netsuke
        # The key names the release and the nightly it builds with; keep it
        # in step with the install step's environment.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/netsuke
          key: netsuke-${{ runner.os }}-${{ runner.arch }}-0.1.0-beta4-nightly-2026-08-23
      - name: Install Netsuke from crates.io
        # The release builds with the dated nightly its own toolchain file
        # pins, not with this repository's toolchain.
        env:
          NETSUKE_TOOLCHAIN: nightly-2026-08-23
          NETSUKE_VERSION: 0.1.0-beta4
        run: |
          set -euo pipefail
          if netsuke --version 2>/dev/null | grep --fixed-strings --quiet "${NETSUKE_VERSION}"; then
            exit 0
          fi
          rustup toolchain install "${NETSUKE_TOOLCHAIN}" --profile minimal
          cargo "+${NETSUKE_TOOLCHAIN}" install --locked \
            netsuke-build --version "=${NETSUKE_VERSION}"
      - name: Test and Measure Coverage
        # The same action, format, output path and default baseline files as
        # the pull-request lane, so the figure written here is the figure a
        # pull request is measured against. The action decides by the event
        # whether it writes the baseline or compares with it.
        uses: leynos/shared-actions/.github/actions/generate-coverage@8e6a325765ba382691d1b1c65fcccf1fc1d1b00c
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
      - name: Check for the CodeScene token
        id: codescene-token
        # The expression is evaluated before the shell runs, so this step reports
        # whether the secret is set while holding nothing in its `env`. No step
        # here binds the token in `env`: the upload action is composite and would
        # hand a step `env` to its nested `upload-artifact` and cache steps, so
        # the upload passes the secret as its `access-token` input instead.
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Upload coverage data to CodeScene
        # An unset secret leaves the upload out rather than failing the lane.
        # The ref conjunct is what keeps the dispatch trigger above from
        # uploading a branch CodeScene does not analyse: the push trigger is
        # restricted to `main`, but a dispatch may name any branch.
        if: ${{ steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main' }}
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@8e6a325765ba382691d1b1c65fcccf1fc1d1b00c
        with:
          path: lcov.info
          format: lcov
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
