# Repository-wide Cargo defaults for the development build standard
# (concordat rules `rust-build-defaults` and `rust-dev-build-footprint`).
#
# The parallel `rustc` frontend and, on Linux, the `mold` linker are the
# defaults for every development, test, lint and typecheck build. Cargo
# auto-discovers this file, so a bare `cargo build` gets them too.
#
# The Cranelift codegen backend is the development-profile default: the
# repository's whole suite passes under it (see "Cranelift" in
# docs/developers-guide.md). Coverage selects LLVM explicitly, since
# instrumentation needs it, and release builds use LLVM through the release
# profile.
#
# `embed-metadata = false` is the native Cargo key for dated nightlies from
# 2026-07-31, so Cargo coordinates metadata output itself. Never use raw rustc
# metadata flags; they broke build scripts.
[unstable]
codegen-backend = true
embed-metadata = false

# Development builds keep neither incremental state nor debug information (DF-001
# and DF-002). Set CARGO_PROFILE_DEV_DEBUG=true to debug, or CARGO_INCREMENTAL=1
# to rebuild incrementally.
[profile.dev]
codegen-backend = "cranelift"
incremental = false
debug = 0

# Cargo selects a single `rustflags` source rather than merging them: a
# matching `[target.*]` table replaces `[build] rustflags` outright, and an
# assigned `RUSTFLAGS` replaces both. Every flag is therefore repeated in each
# source here, and the Netsukefile composes them into the `RUSTFLAGS` its
# actions set. Coverage and release builds assign `RUSTFLAGS` without them on
# purpose: a measurement and a shipped artefact stay on the platform linker
# and the single-threaded frontend.
[build]
rustflags = ["-Zthreads=8"]

# mold ships for Linux only, so the linker flag lives in a Linux-only table.
# macOS and Windows fall through to `[build] rustflags` above and keep their
# platform linker.
[target.'cfg(target_os = "linux")']
rustflags = ["-Zthreads=8", "-Clink-arg=-fuse-ld=mold"]
